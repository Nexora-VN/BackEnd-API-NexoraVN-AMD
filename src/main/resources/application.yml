spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: nexora-vn

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  flyway:
    # Azure DB already has its schema. Turn this on only after baselining it.
    enabled: ${FLYWAY_ENABLED:false}

  # The app uses Azure PostgreSQL directly. Docker Compose, Redis and RabbitMQ
  # are intentionally not part of the default runtime yet.
  docker:
    compose:
      enabled: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
